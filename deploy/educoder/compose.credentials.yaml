# 专用于真实账号的隔离组合。不要与模拟 EduCoder 配方叠加。
services:
  dsh:
    env_file:
      - ${DSH_EDUCODER_LIVE_ENV:?请指定服务器上受限的凭据环境文件}
    environment:
      DSH_EDUCODER_DEDICATED: "1"
    command:
      - web
      - --patch
      - /opt/deepseek-harness/web.cordis.patch.yml
      - --patch
      - /opt/educoder-deployment/workspace.patch.yml
      - --patch
      - /opt/educoder-deployment/credential-boundary.patch.yml
      - --no-open
